# 内嵌 AI 运行形态（E3 单元二收尾起）：AI 能力以模块形式在 platform 进程内执行。
#
# 启用方式：--spring.profiles.active=embedded（与默认 dev/prod 组合使用，
# 例如 --spring.profiles.active=dev,embedded）。
#
# 形态语义：
# - 不启动独立 AI 应用；/api/ai/v1/** 白名单路由经 MVC 基础设施直调内嵌 AI 控制器
#   （LocalAiGatewayClient），不产生任何 localhost HTTP 转发；
# - AI → platform 的三处回调（授权复核、组织事实匹配、许可登记）全部替换为同进程
#   本地接口（LocalPlatformAuthorizationChecker / LocalPlatformFacts / LocalPlatformPermits）；
# - /internal/ai/v1/** 对外一律 404（AiInternalAccessBoundaryFilter，C3 负例语义）；
# - 流式路由（SSE/上传/私有 PDF）在专用本地流传输落地前 fail-closed 503，不静默降级。
#
# 数据库：统一主库（platform schema），无 AI 专用数据源；许可表为
# sys_ai_execution_permit（platform 层）与 ai_execution_permit（AI 运行时层）。
ai:
  integration:
    enabled: true
    # local = 内嵌同进程转送；http = 转发到独立 AI 应用（迁移前形态，默认）
    transport: local
    # 高危写路径（KB 创建/ACL 授予等）仍按既有开关门控，按需显式开启：
    # high-risk:
    #   enabled: true

# P2 正式运行路径（受理/生命周期/上传摄取/私有对象/事件流）——与独立 AI 应用同一开关；
# P0.4 实验路径保持关闭（p04.enabled 缺省 false，与 P2 互斥）。
p2:
  enabled: true
  object-store:
    # 私有对象存储只认 fs（专属目录）；s3/minio 未实现即启动失败，不静默回退。
    type: fs
    root: ${P2_OBJECT_STORE_ROOT:./data/private-objects}

# P3 受控动作面（动作账本/审批/对账）——与独立 AI 应用同一开关。
# 沙箱票据客户端指向独立沙箱进程（有界回环端点）；未启用时以 SANDBOX_CLOSED fail-closed。
p3:
  enabled: true
