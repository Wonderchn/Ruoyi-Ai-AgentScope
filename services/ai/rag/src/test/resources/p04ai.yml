# P0.4 最小 AI 测试应用专用配置。
# 以 --spring.config.name=p04ai 启动时，产品的 application.yaml 完全不会被读取。
server:
  port: 19090

spring:
  application:
    name: p04-ai-test
  main:
    banner-mode: off

  # 受理事务需要真实 PG（唯一约束与事务原子性是本实验的断言对象）
  datasource:
    url: ${P04_AI_DB_URL}
    username: ${P04_AI_DB_USER}
    password: ${P04_AI_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: never

  # 刻意不装配与本实验无关的旧基础设施：Redis/Redisson、RocketMQ、MyBatis-Plus。
  # 这些类名取自各 jar 内 AutoConfiguration.imports 的实测结果（Boot 4.1.0 已把
  # Redis 自动装配移到 spring-boot-data-redis，包名为 org.springframework.boot.data.redis）。
  # 保留 DataSource / JdbcTemplate / 事务自动装配：受理要用真实 PG。
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusInnerInterceptorAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusLanguageDriverAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.DdlAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.IdentifierGeneratorAutoConfiguration
      - cn.dev33.satoken.dao.SaTokenDaoForRedisTemplate

p04:
  delegation:
    # platform 运行期生成的公钥；由验收脚本写入后传给本进程
    public-key-path: ${P04_DELEGATION_PUBLIC_KEY_PATH}
    issuer: platform
    audience: ai
    kid: p04-platform-k1
    clock-skew-seconds: 30
  platform:
    authorization-url: ${P04_PLATFORM_AUTHORIZATION_URL}
    # 只经进程环境注入，不写在文件里
    service-credential: ${P04_SERVICE_CREDENTIAL}
    timeout-millis: 2000

logging:
  level:
    root: info
    com.nageoffer.ai.ragent.rag.runtime: info
    com.nageoffer.ai.ragent.framework.security: info
