# 复用应用连接配置，测评程序不会修改服务配置；JVM 覆盖项须另行记录
application.config=../../../bootstrap/src/main/resources/application.yaml
auth.username=${RAGENT_EVAL_USERNAME:admin}
auth.password=${PROJECT_SERVICES_AI_RESOURCES_REGRESSION_AGENT_MEMORY_EVALUATION_REGRESSION_PROPERTIES_AUTH_PASSWORD_4}
server.connect-timeout-seconds=5
