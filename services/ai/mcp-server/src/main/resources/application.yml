server:
  address: 127.0.0.1
  port: 9099

spring:
  application:
    name: ragent-mcp-server

ragent:
  bit:
    datasource:
      url: jdbc:postgresql://127.0.0.1:5432/ragent_bit?client_encoding=UTF8
      username: postgres
      password: ${PROJECT_SERVICES_AI_MCP_SERVER_SRC_MAIN_RESOURCES_APPLICATION_YML_PASSWORD_14}
    pending-order:
      timeout: 5m
      scan-interval: 1m
