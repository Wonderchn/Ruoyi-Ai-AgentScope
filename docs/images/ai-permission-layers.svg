<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">AI 权限的五层判定</title>
  <desc id="desc">功能权限串、角色授予、租户套餐求交、AI 网关 scope 与资源 ACL/执行许可，五层依次收窄，缺层即拒绝。</desc>
  <rect width="1120" height="600" fill="#ffffff"/>
  <text x="40" y="46" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#0f172a">AI 权限：五层判定，逐层收窄</text>
  <text x="40" y="74" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">没有独立的 AI 权限表；AI 能力复用同一套菜单、角色与套餐，再叠加网关 scope 与数据面授权。</text>

  <!-- layer 1 -->
  <rect x="40" y="100" width="640" height="72" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <circle cx="70" cy="136" r="15" fill="#2563eb"/>
  <text x="70" y="141" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="96" y="130" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0f172a">sys_menu.perms · 权限串目录</text>
  <text x="96" y="152" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">ai:kb:*、ai:document:*、ai:agent:*、ai:skill:*、ai:mcp:*、ai:config:*、ai:run:* …</text>

  <path d="M360 174 L360 188" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="360,194 355,184 365,184" fill="#94a3b8"/>

  <!-- layer 2 -->
  <rect x="40" y="196" width="640" height="72" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <circle cx="70" cy="232" r="15" fill="#2563eb"/>
  <text x="70" y="237" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="96" y="226" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0f172a">sys_role_menu · 角色授予</text>
  <text x="96" y="248" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">在「角色管理 → 分配菜单」勾选；租户管理员默认只拿到本套餐内菜单</text>

  <path d="M360 270 L360 284" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="360,290 355,280 365,280" fill="#94a3b8"/>

  <!-- layer 3 -->
  <rect x="40" y="292" width="640" height="72" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <circle cx="70" cy="328" r="15" fill="#2563eb"/>
  <text x="70" y="333" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="96" y="322" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0f172a">sys_tenant_package.menu_ids · 套餐求交</text>
  <text x="96" y="344" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">实际生效 = 角色菜单 ∩ 租户套餐；套餐没放行的菜单，授了也不生效</text>

  <path d="M360 366 L360 380" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="360,386 355,376 365,376" fill="#94a3b8"/>

  <!-- layer 4 -->
  <rect x="40" y="388" width="640" height="72" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <circle cx="70" cy="424" r="15" fill="#d97706"/>
  <text x="70" y="429" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="96" y="418" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0f172a">AI 网关 scope · 动作级</text>
  <text x="96" y="440" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">委托令牌必须带具体动作（如 agent.write、kb.retrieve）；缺 scope 直接 403</text>

  <path d="M360 462 L360 476" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="360,482 355,472 365,472" fill="#94a3b8"/>

  <!-- layer 5 -->
  <rect x="40" y="484" width="640" height="76" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <circle cx="70" cy="522" r="15" fill="#6d28d9"/>
  <text x="70" y="527" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text x="96" y="514" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0f172a">资源 ACL + 执行许可 · 数据面</text>
  <text x="96" y="536" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">主体与租户归属、共享 ACL、ACL epoch、撤销屏障、执行许可；检索集合为空时</text>
  <text x="96" y="553" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">不会扩大为全库查询</text>

  <!-- notes -->
  <rect x="712" y="100" width="368" height="200" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="732" y="128" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">平台目录的第二道门</text>
  <text x="732" y="152" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">agent.* / skill.* / mcp.* 动作默认还要求</text>
  <text x="732" y="170" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">平台目录身份（超管 / superadmin /</text>
  <text x="732" y="188" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">ai_catalog_admin）。</text>
  <text x="732" y="214" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">开启 tenant-catalog-self-service 后，</text>
  <text x="732" y="232" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">租户可管理本租户副本；平台模板仍只读。</text>
  <text x="732" y="258" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#64748b">默认关闭；内嵌部署按需显式打开。</text>

  <rect x="712" y="316" width="368" height="120" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="732" y="344" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">三条 fail-closed 规则</text>
  <text x="732" y="368" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#7f1d1d">· 缺租户或主体 → 拒绝</text>
  <text x="732" y="388" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#7f1d1d">· ACL epoch 缺行 → 拒绝，不默认 1</text>
  <text x="732" y="408" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#7f1d1d">· 检索授权集合为空 → 扩大为全库</text>

  <rect x="712" y="452" width="368" height="108" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="732" y="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">前端只做显示控制</text>
  <text x="732" y="504" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">菜单隐藏、按钮禁用都不是授权；每个端点</text>
  <text x="732" y="522" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">在后端独立判定，被拒返回 403。</text>
  <text x="732" y="546" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#64748b">超管持有 *:*:*，但 AI 资源面不展开通配。</text>
</svg>
