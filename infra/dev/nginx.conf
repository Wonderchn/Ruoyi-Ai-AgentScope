# Restricted same-origin delivery for the RuoYi web frontend (infra/dev delivery).
#
# Boundary contract (R05/R06):
#   * the browser sees ONE origin; everything AI-ish goes through this proxy to the
#     platform public gateway - the frontend never reaches AI internal endpoints;
#   * only public /api/, /auth/, /system/ and /monitor/ prefixes are proxied;
#     there is no generic upstream pass-through;
#     pass-through, so this file can never become an arbitrary open proxy;
#   * SSE responses are never buffered (a buffered proxy turns event streams into
#     one giant frame and breaks seq-based replay cursors), with bounded timeouts so
#     a stalled upstream cannot hold workers forever;
#   * uploads are bounded server-side at 50 MiB, matching the product limit;
#   * private PDFs are NOT served from any static directory: they only exist behind
#     the authorized gateway route, which re-checks the caller on every request.

server {
    listen 80;
    server_name _;

# ---- static frontend -------------------------------------------------------
location = /admin { return 308 /admin/; }
location /admin/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
}
location /internal/ { return 404; }
location /actuator { return 404; }

location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
}

# ---- ES module assets (pdf.js worker) --------------------------------------
# The base mime.types has no .mjs mapping, so the worker module was served as
# application/octet-stream and rejected by the browser's module-worker loader.
location ~* \.mjs$ {
    root /usr/share/nginx/html;
    default_type application/javascript;
}

# ---- SSE: never buffered, bounded -----------------------------------------
location ~ ^/api/ai/v1/runs/[^/]+/events$ {
    proxy_pass http://platform:6039;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
}

# ---- platform public gateway (the only proxied upstreams) ------------------
location /api/ {
    proxy_pass http://platform:6039;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 50m;
}

location /auth/ {
    proxy_pass http://platform:6039;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# Admin business APIs stay on the same origin; backend permissions apply.
location /system/ {
    proxy_pass http://platform:6039;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 50m;
}
location /monitor/ {
    proxy_pass http://platform:6039;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
}
