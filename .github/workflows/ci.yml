name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/platform/pom.xml
      - name: Build and test platform
        working-directory: services/platform
        run: mvn -B -ntp -Pdev clean verify
      - name: Verify at least one platform test ran
        run: python3 scripts/ci/check-surefire.py services/platform
      - name: Ensure build left sources unchanged
        run: git diff --exit-code

  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/ai/pom.xml
      - name: Build and test AI service
        working-directory: services/ai
        run: mvn -B -ntp -Pci clean verify
      - name: Verify at least one AI test ran
        run: python3 scripts/ci/check-surefire.py services/ai
      - name: Ensure build left sources unchanged
        run: git diff --exit-code

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/ai/frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: services/ai/frontend
        run: npm ci
      - name: Lint
        working-directory: services/ai/frontend
        run: npm run lint
      - name: Build
        working-directory: services/ai/frontend
        run: npm run build

  ruoyi-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned runtimes: node 22.23.2 (engines >=22.13.0) and the packageManager-pinned
      # pnpm 11.0.9. The version is installed explicitly, not via mutable "latest".
      # setup-node's pnpm cache mode needs the pnpm binary to exist first, so the
      # cache-enabled setup call comes after the install.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install pinned pnpm
        run: npm install -g pnpm@11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
          cache-dependency-path: services/web/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: services/web
        run: pnpm install --frozen-lockfile
      # The test loader transpiles without type checking, so the protocol package's type
      # check must run on its own or TS errors ship silently.
      - name: Type-check protocol packages and both applications
        working-directory: services/web
        run: pnpm typecheck
      - name: Run all protocol and application tests
        working-directory: services/web
        run: |
          pnpm test
          node --test ../../scripts/ci/read-path-observation.test.mjs
      - name: Lint
        working-directory: services/web
        run: pnpm lint
      - name: Build both applications (includes vue-tsc)
        working-directory: services/web
        run: pnpm build
      - name: Ensure the checks left sources unchanged
        working-directory: services/web
        run: git diff --exit-code

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rebuild the platform domain from the repository PostgreSQL files
        run: bash scripts/ci/verify-platform-migrations.sh
      - name: Ensure the check left the sources unchanged
        run: git diff --exit-code

  db-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rebuild both domains from the repository PostgreSQL files (platform V1..V6, AI V1..V12)
        run: bash scripts/ci/verify-ai-migrations.sh
      - name: Ensure the check left the sources unchanged
        run: git diff --exit-code

  db-unified:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the unified chain from fresh and legacy databases
        env:
          PG_OWNER: unified-${{ github.run_id }}-${{ github.run_attempt }}
          PG_CONTAINER: unified-pg-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ci/verify-unified-migrations.sh
      - name: Ensure the check left sources unchanged
        run: git diff --exit-code

  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            services/platform/pom.xml
            services/ai/pom.xml
      - name: Build both Boot JARs
        run: |
          mvn -B -ntp -f services/platform/pom.xml -Pdev -DskipTests package
          mvn -B -ntp -f services/ai/pom.xml -Pci -DskipTests package
      # Owner tag is unique per run; the script refuses any resource-name or port
      # collision instead of reusing or deleting anything.
      - name: Run the native failure matrix (N1 admission / N2 worker takeover / N3 SSE continuity)
        env:
          OWNER: nativerun-${{ github.run_id }}-${{ github.run_attempt }}
          AI_JAR: ${{ github.workspace }}/services/ai/bootstrap/target/bootstrap-0.0.1-SNAPSHOT.jar
          PLATFORM_JAR: ${{ github.workspace }}/services/platform/ruoyi-admin/target/ruoyi-admin.jar
        run: bash scripts/ci/verify-native-runtime.sh
      - name: Ensure the checks left the sources unchanged
        run: git diff --exit-code

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source metadata and public configuration
        run: python3 scripts/ci/check-public-source.py
      - name: Check independent unified migration expectations and negative controls
        run: |
          python3 scripts/ci/check-unified-contract.py
          python3 scripts/ci/test-unified-contract.py

  ci-required:
    if: always()
    needs: [platform, ai, frontend, ruoyi-web, policy, db, db-ai, db-unified, native-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          PLATFORM: ${{ needs.platform.result }}
          AI: ${{ needs.ai.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUOYI_WEB: ${{ needs.ruoyi-web.result }}
          POLICY: ${{ needs.policy.result }}
          DB: ${{ needs.db.result }}
          DB_AI: ${{ needs.db-ai.result }}
          DB_UNIFIED: ${{ needs.db-unified.result }}
          NATIVE: ${{ needs.native-runtime.result }}
        run: |
          for result in "$PLATFORM" "$AI" "$FRONTEND" "$RUOYI_WEB" "$POLICY" "$DB" "$DB_AI" "$DB_UNIFIED" "$NATIVE"; do
            if [ "$result" != success ]; then
              echo "A required job did not succeed: $result" >&2
              exit 1
            fi
          done
