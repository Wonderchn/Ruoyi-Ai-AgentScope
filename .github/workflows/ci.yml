name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/platform/pom.xml
      - name: Build and test platform
        working-directory: services/platform
        run: mvn -B -ntp -Pdev clean verify
      - name: Verify at least one platform test ran
        run: python3 scripts/ci/check-surefire.py services/platform
      - name: Ensure build left sources unchanged
        run: git diff --exit-code

  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/ai/pom.xml
      - name: Build and test AI service
        working-directory: services/ai
        run: mvn -B -ntp -Pci clean verify
      - name: Verify at least one AI test ran
        run: python3 scripts/ci/check-surefire.py services/ai
      - name: Ensure build left sources unchanged
        run: git diff --exit-code

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/ai/frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: services/ai/frontend
        run: npm ci
      - name: Lint
        working-directory: services/ai/frontend
        run: npm run lint
      - name: Build
        working-directory: services/ai/frontend
        run: npm run build

  ruoyi-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned runtimes: node 22.23.2 (engines >=22.13.0) and the packageManager-pinned
      # pnpm 11.0.9. The version is installed explicitly, not via mutable "latest".
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
          cache-dependency-path: services/ruoyi-web/pnpm-lock.yaml
      - name: Install pinned pnpm
        run: npm install -g pnpm@11.0.9
      - name: Install locked dependencies
        working-directory: services/ruoyi-web
        run: pnpm install --frozen-lockfile
      # The test loader transpiles without type checking, so the test project's
      # type check must run on its own or TS errors ship silently.
      - name: Type-check the test project
        working-directory: services/ruoyi-web
        run: pnpm exec tsc -p tsconfig.tests.json --noEmit
      - name: Run the Node protocol tests
        working-directory: services/ruoyi-web
        run: node --import ./tests/ts-loader.mjs --test ./tests/RunStreamClient.test.ts ./tests/SseSyntax.test.ts ./tests/RagApi.test.ts ./tests/RagTransport.test.ts
      - name: Lint
        working-directory: services/ruoyi-web
        run: pnpm lint
      - name: Build (includes the app type check via vue-tsc -b)
        working-directory: services/ruoyi-web
        run: pnpm build
      - name: Ensure the checks left sources unchanged
        working-directory: services/ruoyi-web
        run: git diff --exit-code

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rebuild the platform domain from the repository PostgreSQL files
        run: bash scripts/ci/verify-platform-migrations.sh
      - name: Ensure the check left the sources unchanged
        run: git diff --exit-code

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source metadata and public configuration
        run: python3 scripts/ci/check-public-source.py

  ci-required:
    if: always()
    needs: [platform, ai, frontend, ruoyi-web, policy, db]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          PLATFORM: ${{ needs.platform.result }}
          AI: ${{ needs.ai.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUOYI_WEB: ${{ needs.ruoyi-web.result }}
          POLICY: ${{ needs.policy.result }}
          DB: ${{ needs.db.result }}
        run: |
          for result in "$PLATFORM" "$AI" "$FRONTEND" "$RUOYI_WEB" "$POLICY" "$DB"; do
            if [ "$result" != success ]; then
              echo "A required job did not succeed: $result" >&2
              exit 1
            fi
          done
