name: Publish GHCR images

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'infra/docker/**'
      - 'infra/dev/nginx.conf'
      - '.dockerignore'
      - 'services/web/**'
      - 'scripts/ci/release-manifest.py'
      - 'scripts/ci/test-release-manifest.py'
      - 'scripts/ci/verify-release-images.py'
      - 'docs/release-compatibility.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check manifest rejection and compatibility contracts
        run: python3 scripts/ci/test-release-manifest.py
      - uses: docker/setup-buildx-action@v3
      - name: Build both frontend applications
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/ruoyi-web.Dockerfile
          load: true
          tags: release-web-test:${{ github.sha }}
      - name: Verify delivered pages, assets and proxy boundary
        run: python3 scripts/ci/verify-release-images.py --web release-web-test:${{ github.sha }}

  publish:
    needs: [verify, image-contracts]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ruoyi-ai-agentscope-platform
            context: services/platform
            dockerfile: infra/docker/platform.Dockerfile
          - image: ruoyi-ai-agentscope-ai
            context: services/ai
            dockerfile: infra/docker/ai.Dockerfile
          - image: ruoyi-ai-agentscope-web
            context: .
            dockerfile: infra/docker/ruoyi-web.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/wonderchn/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record published digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p release-manifest
          printf '%s\n' "ghcr.io/wonderchn/${IMAGE}@${DIGEST}" "source=${SHA}" > "release-manifest/${IMAGE}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ matrix.image }}
          path: release-manifest/${{ matrix.image }}.txt
          if-no-files-found: error

  manifest:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-manifest-*
          path: image-digests
          merge-multiple: true
      - name: Bind three digests and compatibility to this checkout
        run: >-
          python3 scripts/ci/release-manifest.py create
          --source '${{ github.sha }}' --repository '${{ github.repository }}'
          --digests image-digests --output release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error

  verify-pull:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
      - name: Pull anonymously and verify published contents
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          python3 scripts/ci/verify-release-images.py --manifest release-manifest.json --source '${{ github.sha }}' --repository '${{ github.repository }}' --output image-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-verification
          path: image-verification.json
          if-no-files-found: error

  promote:
    needs: verify-pull
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified digests if this commit is still main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/ci/verify-release-images.py --manifest release-manifest.json
          --source '${{ github.sha }}' --repository '${{ github.repository }}'
          --promote --output image-promotion.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-promotion
          path: image-promotion.json
          if-no-files-found: error
