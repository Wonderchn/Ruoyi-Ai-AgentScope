name: Publish GHCR images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ruoyi-ai-agentscope-platform
            context: services/platform
            dockerfile: infra/docker/platform.Dockerfile
          - image: ruoyi-ai-agentscope-ai
            context: services/ai
            dockerfile: infra/docker/ai.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/wonderchn/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record published digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
          OWNER: wonderchn
        run: |
          mkdir -p release-manifest
          printf '%s\n' "ghcr.io/${OWNER}/${IMAGE}@${DIGEST}" "source=${SHA}" > "release-manifest/${IMAGE}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ matrix.image }}
          path: release-manifest/${{ matrix.image }}.txt
          if-no-files-found: error
